{% extends 'base.html' %}
{% block title %}Delete Challenge - CodeQuest{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px;">
    <div class="card shadow-sm">
        <div class="card-body text-center py-5">
            <i class="bi bi-exclamation-triangle-fill text-danger fs-1 mb-3 d-block"></i>
            <h4>Delete this challenge?</h4>
            <p class="text-muted mb-4">"{{ challenge.title }}" and all its submissions will be permanently removed.</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                    <a href="{% url 'challenge_detail' challenge.pk %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
